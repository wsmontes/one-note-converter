[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "onenote-converter"
description = "Read Microsoft OneNote .one sections, .onetoc2 notebooks and .onepkg packages in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Wagner Montes", email = "wmontes@gmail.com" }]
keywords = ["onenote", "markdown", "ms-onestore", "converter", "notebook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/wsmontes/one-note-converter"
Repository = "https://github.com/wsmontes/one-note-converter"
Documentation = "https://github.com/wsmontes/one-note-converter/blob/main/python/README.md"
Changelog = "https://github.com/wsmontes/one-note-converter/blob/main/CHANGELOG.md"
Issues = "https://github.com/wsmontes/one-note-converter/issues"

[tool.maturin]
module-name = "onenote"
manifest-path = "Cargo.toml"
features = ["extension-module"]
