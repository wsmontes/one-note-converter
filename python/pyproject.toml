[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "onenote"
description = "Read Microsoft OneNote .one sections, .onetoc2 notebooks and .onepkg packages"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["onenote", "markdown", "ms-onestore", "converter"]
dynamic = ["version"]

[tool.maturin]
module-name = "onenote"
features = ["extension-module"]
