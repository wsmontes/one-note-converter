[package]
name = "onenote-py"
description = "Python bindings for the OneNote (MS-ONESTORE) reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Published to PyPI as a wheel/sdist, never as a crate.
publish = false

[lib]
name = "onenote"
crate-type = ["cdylib"]

[features]
# Enabled by maturin when building the extension; keeps `cargo test` in this
# crate linkable against libpython.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py38"] }
one-note-converter = { path = "..", version = "0.1.0" }
